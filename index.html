
<script>
function reset() {
    player = {
        x: 90,
        y: 265,
        w: 34,
        h: 48,
        vy: 0,
        ground: true
    };

    obstacles = [];
    stars = [];
    score = 0;
    speed = 4;
    frame = 0;
    running = true;
    ended = false;

    scoreEl.textContent = 'النجوم: 0';
    message.textContent = 'يلا! اجمعي النجوم وتجنبي العوائق!';
    document.getElementById('start').textContent = 'إعادة اللعب';

    requestAnimationFrame(loop);
}

function jump() {
    if (!running) {
        if (ended) reset();
        return;
    }

    if (player.ground) {
        player.vy = -12;
        player.ground = false;
    }
}

document.getElementById('start').addEventListener('click', reset);
document.getElementById('jump').addEventListener('click', jump);
canvas.addEventListener('pointerdown', jump);

document.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
    }
});

function drawBackground() {
    ctx.clearRect(0, 0, 760, 360);

    ctx.fillStyle = '#ffeaa0';

    for (let i = 0; i < 45; i++) {
        let x = (i * 137 - frame * 0.25) % 760;

        if (x < 0) x += 760;

        let y = (i * 67) % 220;
        ctx.fillRect(x, y, 3, 3);
    }

    ctx.fillStyle = '#33235f';
    ctx.fillRect(0, 315, 760, 45);

    ctx.fillStyle = '#a58bff';
    ctx.fillRect(0, 315, 760, 5);
}

function loop() {
    if (!running) return;

    frame++;

    drawBackground();

    // حركة اللاعب والجاذبية
    player.vy += 0.55;
    player.y += player.vy;

    if (player.y + player.h >= 315) {
        player.y = 315 - player.h;
        player.vy = 0;
        player.ground = true;
    }

    // إنشاء العوائق
    if (frame % 85 === 0) {
        obstacles.push({
            x: 780,
            y: 280,
            w: 28,
            h: 35
        });
    }

    // إنشاء النجوم
    if (frame % 65 === 0) {
        stars.push({
            x: 780,
            y: 205 + Math.random() * 65,
            r: 11
        });
    }

    // تحريك العناصر
    obstacles.forEach(function(o) {
        o.x -= speed;
    });

    stars.forEach(function(s) {
        s.x -= speed;
    });

    // حذف العناصر التي خرجت من الشاشة
    obstacles = obstacles.filter(function(o) {
        return o.x + o.w > 0;
    });

    stars = stars.filter(function(s) {
        return s.x + s.r > 0;
    });

    // رسم العوائق والتحقق من الاصطدام
    ctx.fillStyle = '#ff7c91';

    obstacles.forEach(function(o) {
        ctx.beginPath();
        ctx.moveTo(o.x, o.y + o.h);
        ctx.lineTo(o.x + o.w / 2, o.y);
        ctx.lineTo(o.x + o.w, o.y + o.h);
        ctx.closePath();
        ctx.fill();

        if (
            player.x + player.w - 5 > o.x &&
            player.x + 5 < o.x + o.w &&
            player.y + player.h - 4 > o.y &&
            player.y + 5 < o.y + o.h
        ) {
            running = false;
            ended = true;

            message.textContent =
                'انتهت اللعبة! نتيجتك: ' + score +
                ' نجمة. اضغطي إعادة اللعب للمحاولة.';
        }
    });

    // رسم النجوم وجمعها
    stars.forEach(function(s) {
        ctx.fillStyle = '#ffe66d';
        ctx.beginPath();

        for (let i = 0; i < 10; i++) {
            let r = i % 2 === 0 ? s.r : s.r * 0.45;
            let a = -Math.PI / 2 + i * Math.PI / 5;

            let x = s.x + Math.cos(a) * r;
            let y = s.y + Math.sin(a) * r;

            if (i === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        }

        ctx.closePath();
        ctx.fill();

        let dx = player.x + player.w / 2 - s.x;
        let dy = player.y + player.h / 2 - s.y;

        if (Math.hypot(dx, dy) < 30) {
            s.x = -100;
            score++;

            scoreEl.textContent = 'النجوم: ' + score;

            // زيادة الصعوبة كل خمس نجوم
            if (score % 5 === 0) {
                speed += 0.4;
            }
        }
    });

    // رسم اللاعب
    ctx.fillStyle = '#8be9fd';
    ctx.fillRect(
        player.x,
        player.y + 12,
        player.w,
        player.h - 12
    );

    // العين
    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x + 21, player.y + 20, 7, 7);

    ctx.fillStyle = '#211344';
    ctx.fillRect(player.x + 24, player.y + 22, 3, 3);

    // القدمين
    ctx.fillStyle = '#ffe66d';
    ctx.fillRect(player.x + 4, player.y + player.h - 5, 11, 8);
    ctx.fillRect(player.x + 23, player.y + player.h - 5, 11, 8);

    if (running) {
        requestAnimationFrame(loop);
    }
}

drawBackground();
</script>
